name: Daily dev-post draft

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 07:30 UTC = 16:30 KST, 월~금 (주말 제외)
  workflow_dispatch:          # 수동 실행 가능

permissions:
  contents: write
  pull-requests: write
  actions: write   # 머지 후 deploy 워크플로를 직접 실행하기 위해 필요

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Generate draft (skips on KR holidays)
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/curate.mjs

      - name: Open PR
        if: steps.gen.outputs.created == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/daily-post
          delete-branch: true
          add-paths: src/content/blog/*.md
          commit-message: "post: 오늘의 개발글 큐레이션 초안"
          title: "📝 ${{ steps.gen.outputs.title }}"
          body: |
            자동 생성된 개발글 큐레이션입니다.
            PR이 정상 생성되면 자동으로 머지되어 발행됩니다.

      - name: Auto-merge & deploy
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5   # PR 생성 직후 mergeability 계산 대기
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --merge --delete-branch
          # GITHUB_TOKEN으로 머지된 push는 다른 워크플로를 트리거하지 않으므로
          # (workflow_dispatch는 예외) 배포를 직접 실행한다
          gh workflow run deploy.yml --ref main
